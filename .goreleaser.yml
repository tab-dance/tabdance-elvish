version: 2

before:
  hooks:
    - go mod download

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X src.elv.sh/pkg/buildinfo.VersionBase={{ .Version }}
    main: ./cmd/elvish
    binary: elvish
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: '{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: SHA256SUMS

release:
  prerelease: "false"

aurs:
  - 
    description: "An Elvish fork with completion enhancements"
    homepage: "https://github.com/tab-dance/elvish"
    license: "BSD-2-Clause"
    maintainers:
      - rsteube <rsteube@users.noreply.github.com>
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/tabdance-elvish-bin.git"
    provides:
      - elvish
    conflicts:
      - elvish

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
