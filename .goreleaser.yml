version: 2

before:
  hooks:
    - go mod download

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X src.elv.sh/pkg/buildinfo.VersionBase={{ .Version }}
    main: ./cmd/elvish
    binary: elvish
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: '{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: SHA256SUMS

release:
  prerelease: "false"

aurs:
  - name: tabdance-elvish-bin
    ids:
      - default
    homepage: "https://github.com/tab-dance/elvish"
    description: "Fork of Elvish with completion enhancements for external tools"
    license: "BSD-2-Clause"
    maintainers:
      - "tab-dance <https://github.com/tab-dance>"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/tabdance-elvish-bin.git"
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Update to {{ .Tag }}"
    package: |-
      install -Dm755 "./elvish" "${pkgdir}/usr/bin/elvish"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/tabdance-elvish-bin/LICENSE"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
